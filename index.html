<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Stock Signal AI v2</title>
<style>
:root{--bg:#07111f;--card:#101d31;--line:#263a57;--txt:#f3f7ff;--muted:#9db0ca;--blue:#4d8dff;--green:#35d58b;--red:#ff6b72;--yellow:#ffd166}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#06101d,#0a1730);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",system-ui,sans-serif}
main{max-width:650px;margin:auto;padding:18px 14px 40px}.brand{padding:12px 2px 18px}.brand h1{font-size:25px;margin:0}.brand p{color:var(--muted);margin:6px 0 0;font-size:14px}
.card{background:rgba(16,29,49,.97);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 14px 34px #0004}
h2{font-size:17px;margin:0 0 13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
label{display:block;color:var(--muted);font-size:12px;margin:0 0 6px} select,input{width:100%;background:#091426;color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:13px;font-size:16px}
.drop{margin-top:13px;border:2px dashed #3a567b;border-radius:17px;padding:20px 12px;text-align:center;position:relative}.drop strong{display:block;font-size:18px;margin-bottom:5px}.drop small{color:var(--muted)}
.file{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
#preview{display:none;width:100%;max-height:440px;object-fit:contain;border-radius:14px;margin-top:13px;background:#050b14}
button{width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:800;color:white;background:var(--blue);margin-top:13px}
button:disabled{opacity:.55}.status{text-align:center;color:var(--muted);font-size:13px;margin-top:10px;min-height:20px}
.result{display:none}.hero{text-align:center;background:#091426;border-radius:17px;padding:20px}.signal{font-size:31px;font-weight:900}.confidence{color:var(--muted);margin-top:6px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px}.metric{background:#091426;border-radius:13px;padding:11px 5px;text-align:center}.metric small{display:block;color:var(--muted);font-size:11px}.metric b{display:block;margin-top:5px;font-size:14px}
table{width:100%;border-collapse:collapse;margin-top:8px}td{padding:10px 3px;border-bottom:1px solid var(--line);font-size:14px}td:last-child{text-align:right;font-weight:700}
.reason{line-height:1.7;color:#d7e2f3;font-size:14px}.warn{color:var(--yellow);font-size:12px;line-height:1.5;margin-top:12px}
.bad{color:var(--red)}.good{color:var(--green)}
</style>
</head>
<body><main>
<div class="brand"><h1>STOCK SIGNAL AI <span style="color:#4d8dff">v2</span></h1><p>차트 한 장으로 기술적 지표 자동 판독</p></div>

<section class="card">
<h2>1. 차트 설정</h2>
<div class="row">
 <div><label>종목</label><input id="ticker" placeholder="예: TSLA" value="TSLA" autocapitalize="characters"></div>
 <div><label>시간봉</label><select id="tf"><option>5분</option><option>15분</option><option>30분</option><option>1시간</option><option>4시간</option><option selected>일봉</option></select></div>
</div>
<div class="drop"><strong>📷 차트 사진 선택</strong><small>카메라 또는 사진 보관함에서 선택하세요</small><input class="file" id="file" type="file" accept="image/*"></div>
<img id="preview" alt="업로드 차트">
<button id="go" disabled>AI 자동 분석</button>
<div class="status" id="status">먼저 차트 사진을 선택하세요.</div>
</section>

<section class="card result" id="result">
<h2>2. 분석 결과</h2>
<div class="hero"><div class="signal" id="signal">-</div><div class="confidence" id="confidence">-</div></div>
<div class="metrics">
 <div class="metric"><small>RSI</small><b id="rsi">-</b></div>
 <div class="metric"><small>STOCH K/D</small><b id="stoch">-</b></div>
 <div class="metric"><small>MACD</small><b id="macd">-</b></div>
</div>
<table>
<tr><td>판독 종목</td><td id="rticker">-</td></tr>
<tr><td>현재가</td><td id="price">-</td></tr>
<tr><td>추세</td><td id="trend">-</td></tr>
<tr><td>지지선</td><td id="support">-</td></tr>
<tr><td>저항선</td><td id="resistance">-</td></tr>
<tr><td>무효화 조건</td><td id="invalid">-</td></tr>
</table>
<h2 style="margin-top:18px">판단 근거</h2><div class="reason" id="reason"></div>
<div class="warn">이미지에서 확인할 수 없는 값은 추정하지 않고 ‘판독 불가’로 표시합니다. 기술적 분석은 참고 신호이며 미래 가격을 보장하지 않습니다.</div>
</section>
</main>
<script>
const $=x=>document.getElementById(x); let selected=null;
$("file").onchange=e=>{selected=e.target.files[0]; if(!selected)return; $("preview").src=URL.createObjectURL(selected);$("preview").style.display="block";$("go").disabled=false;$("status").textContent="사진이 준비되었습니다.";};
$("go").onclick=async()=>{
 if(!selected)return; $("go").disabled=true;$("status").textContent="차트를 판독하고 있습니다…";
 const fd=new FormData();fd.append("image",selected);fd.append("ticker",$("ticker").value.trim().toUpperCase());fd.append("timeframe",$("tf").value);
 try{
  const r=await fetch("/api/analyze",{method:"POST",body:fd}); const d=await r.json();
  if(!r.ok)throw new Error(d.error||"분석 실패");
  $("result").style.display="block";
  const val=(x)=>x===null||x===undefined||x===""?"판독 불가":x;
  $("signal").textContent=val(d.signal); $("signal").className="signal "+(d.signal?.includes("매수")?"good":d.signal?.includes("매도")?"bad":"");
  $("confidence").textContent="이미지 판독 신뢰도 "+val(d.confidence)+"%";
  $("rsi").textContent=val(d.rsi);$("stoch").textContent=val(d.stoch_k)+" / "+val(d.stoch_d);
  $("macd").textContent=val(d.macd)+" / "+val(d.macd_signal);
  $("rticker").textContent=val(d.ticker);$("price").textContent=val(d.current_price);$("trend").textContent=val(d.trend);
  $("support").textContent=val(d.support);$("resistance").textContent=val(d.resistance);$("invalid").textContent=val(d.invalidation);
  $("reason").innerHTML=(d.reasons||[]).map(x=>"• "+x).join("<br>")||"판독 근거 없음";
  $("status").textContent="분석 완료"; $("result").scrollIntoView({behavior:"smooth"});
 }catch(e){$("status").textContent="오류: "+e.message;} finally{$("go").disabled=false;}
};
</script></body></html>
